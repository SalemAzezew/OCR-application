<!DOCTYPE html>
<html>
<head>
  <title>OCR App</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #b7d9fb;
      font-family: Arial, sans-serif;
    }
    .container {
      margin-top: 50px;
    }
    .card {
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(5, 5, 5, 0.1);
    }
    .btn-custom {
      background-color: #007bff;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="card-body">
        <h1 class="card-title">Upload an Image for OCR</h1>
        <form id="uploadForm" action="http://localhost:4000/upload" method="post" enctype="multipart/form-data">
          <div class="form-group">
            <label for="image">Select Image</label>
            <input type="file" class="form-control-file" id="image" name="image" required />
          </div>
          <div class="form-group">
            <label for="language">Select Language</label>
            <select class="form-control" id="language" name="language">
              <option value="eng">English</option>
              <option value="amh">Amharic</option>
              <!-- Add more languages if needed -->
            </select>
          </div>
          <button type="submit" class="btn btn-custom">Upload Image</button>
        </form>
      </div>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
